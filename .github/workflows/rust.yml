name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatage
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Build release
        run: cargo build --workspace --all-features --release

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` fixe le canal `stable` ; le `+1.85.0` explicite le
      # supplante pour verifier que le plancher declare dans Cargo.toml tient.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Compilation au plancher de compatibilite
        run: cargo +1.85.0 check --workspace --all-features

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Le coeur doit rester testable sur la machine de developpement, sans ROS 2,
      # sans WSL et sans Docker. Cette garantie est verifiee, pas supposee.
      - name: Tests
        run: cargo test --workspace --all-features
