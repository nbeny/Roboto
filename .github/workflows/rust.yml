name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatage
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Build release
        run: cargo build --workspace --all-features --release

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` fixe le canal `stable` ; le `+1.85.0` explicite le
      # supplante pour verifier que le plancher declare dans Cargo.toml tient.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Compilation au plancher de compatibilite
        run: cargo +1.85.0 check --workspace --all-features

  ros2:
    name: Adaptateur ROS 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # L'image embarque ROS 2 Jazzy, Rust et l'espace colcon ros2_rust, dont la
      # construction genere les crates Rust des messages. Voir
      # docs/architecture/0005-adaptateur-ros2-hors-workspace.md.
      - name: Construire l'image ROS 2
        uses: docker/build-push-action@v6
        with:
          context: docker/ros2
          tags: roboto-ros2:jazzy
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construire l'adaptateur
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace/ros2 \
            roboto-ros2:jazzy colcon build

      - name: Tester l'adaptateur
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace/ros2 \
            roboto-ros2:jazzy colcon test --event-handlers console_direct+

  simulation:
    name: Simulation Gazebo
    runs-on: ubuntu-latest
    # Le job le plus lourd de la chaine : construction de l'image, puis Gazebo en rendu
    # logiciel. Il ne garde qu'une chose, mais elle vaut le cout : que le robot simule
    # obeisse encore au coeur Rust, et que la couche de securite tienne jusque dans le
    # simulateur.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image ROS 2
        uses: docker/build-push-action@v6
        with:
          context: docker/ros2
          tags: roboto-ros2:jazzy
          load: true
          cache-from: type=gha,scope=ros2
          cache-to: type=gha,mode=max,scope=ros2

      - name: Construire l'image de simulation
        uses: docker/build-push-action@v6
        with:
          context: docker/simulation
          tags: roboto-sim:jazzy
          load: true
          cache-from: type=gha,scope=sim
          cache-to: type=gha,mode=max,scope=sim

      - name: Construire l'adaptateur
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace/ros2 \
            roboto-sim:jazzy colcon build

      - name: Essai de bout en bout en simulation
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            roboto-sim:jazzy bash scripts/sim-smoke-test.sh

      # Verifie aussi que la marge entre les limites de Nav2 et l'enveloppe de securite
      # tient : voir docs/architecture/0007-marge-entre-nav2-et-la-securite.md.
      - name: Essai de navigation autonome
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            roboto-sim:jazzy bash scripts/nav-smoke-test.sh

  api:
    name: API TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
        working-directory: api

      # Sans ROS 2 : les essais font tourner un faux pont rosbridge en memoire. C'est
      # tout l'interet d'avoir choisi un protocole JSON plutot qu'un binding natif.
      - run: npm test
        working-directory: api

      - run: npm run typecheck
        working-directory: api

      - run: npm run build
        working-directory: api

  web:
    name: Tableau de bord
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - run: npm run build
        working-directory: web

  agent:
    name: Agent IA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
        working-directory: ai

      # Sans reseau, sans robot, sans cle API : la couche de securite de l'agent n'a
      # aucune dependance, et c'est precisement ce qui la rend verifiable ainsi.
      - run: python -m pytest -q
        working-directory: ai

      # Le catalogue doit rester serialisable : il part tel quel dans une requete.
      - run: python -m roboto_agent --print-tools > /dev/null
        working-directory: ai

  vision:
    name: Vision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
        working-directory: vision

      # Aucune camera, aucune photo, aucun poids de modele : les essais fabriquent leurs
      # propres marqueurs avec OpenCV, qui sait produire ce qu'il sait lire.
      - run: python -m pytest -q
        working-directory: vision

  voice:
    name: Voix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
        working-directory: voice

      - run: python -m pytest -q
        working-directory: voice

      # Le court-circuit d'arret trie correctement les phrases. Sans micro, sans modele,
      # sans robot : c'est tout l'interet de l'avoir ecrit sans dependance.
      - run: python -m roboto_voice --self-test
        working-directory: voice

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Le coeur doit rester testable sur la machine de developpement, sans ROS 2,
      # sans WSL et sans Docker. Cette garantie est verifiee, pas supposee.
      - name: Tests
        run: cargo test --workspace --all-features
