[workspace]
resolver = "3"
members = [
    "crates/robot-types",
    "crates/robot-safety",
    "crates/robot-core",
    "crates/robot-telemetry",
    "crates/robot-mcu",
    "crates/robot-hal",
    "crates/robot-firmware",
]

# `ros2/` contient un espace colcon, pas des membres Cargo. Les crates de messages
# ROS 2 (`geometry_msgs`, `std_msgs`...) sont generees localement par `rosidl_rust` :
# elles n'existent pas sur crates.io et ne peuvent donc pas etre resolues ici.
# Voir docs/architecture/0005-adaptateur-ros2-hors-workspace.md.
exclude = ["ros2"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/nbeny/Roboto"
authors = ["Nicolas BENY"]

[workspace.dependencies]
robot-types = { path = "crates/robot-types", version = "0.1.0" }
robot-safety = { path = "crates/robot-safety", version = "0.1.0" }
robot-core = { path = "crates/robot-core", version = "0.1.0" }
robot-mcu = { path = "crates/robot-mcu", version = "0.1.0" }
robot-hal = { path = "crates/robot-hal", version = "0.1.0" }
robot-firmware = { path = "crates/robot-firmware", version = "0.1.0" }

serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
