[workspace]
resolver = "3"
members = [
    "crates/robot-types",
    "crates/robot-safety",
    "crates/robot-core",
    "crates/robot-telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/nbeny/Roboto"
authors = ["Nicolas BENY"]

[workspace.dependencies]
robot-types = { path = "crates/robot-types", version = "0.1.0" }
robot-safety = { path = "crates/robot-safety", version = "0.1.0" }
robot-core = { path = "crates/robot-core", version = "0.1.0" }

serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
