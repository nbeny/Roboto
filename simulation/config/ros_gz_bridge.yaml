# Pont entre les topics Gazebo et les topics ROS 2.
#
# Le sens de chaque pont est explicite. Un seul va de ROS vers Gazebo : la consigne de
# vitesse. Et il part de `~/cmd_vel_safe`, la sortie du coeur **apres** la couche de
# securite. Le robot simule n'ecoute aucun autre topic de commande, donc il n'existe pas
# de chemin permettant de piloter ses roues en contournant `robot-safety`.

# --- Temps simule ---------------------------------------------------------------------
# Doit venir en premier : sans lui, le noeud attend et ne decide rien.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# --- Commande, seule direction ROS vers Gazebo ------------------------------------------
- ros_topic_name: "/robot_core/cmd_vel_safe"
  gz_topic_name: "/roboto/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# --- Odometrie et transformations -------------------------------------------------------
- ros_topic_name: "/odom"
  gz_topic_name: "/roboto/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/roboto/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/roboto/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# --- Capteurs ---------------------------------------------------------------------------
- ros_topic_name: "/scan"
  gz_topic_name: "/roboto/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/roboto/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/roboto/camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
